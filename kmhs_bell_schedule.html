<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMHS Bell Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen w-screen overflow-hidden flex flex-col items-center justify-between p-6">

    <div class="mt-8 sm:mt-12 text-center w-full max-w-lg">
        <h2 class="text-xs sm:text-sm text-slate-400 font-semibold tracking-widest uppercase mb-1">Today Is...</h2>
        <!-- Medium weight font for the date as requested -->
        <h1 id="date-display" class="text-2xl sm:text-4xl font-medium text-slate-900">Loading date...</h1>
        <div id="day-badge" class="mt-2 inline-block px-3 py-1 rounded-full text-xs font-bold tracking-wider uppercase bg-slate-200 text-slate-700">
            Checking Day...
        </div>
    </div>

    <div class="flex-grow flex flex-col items-center justify-center w-full max-w-xl px-4">
        <div id="block-display" class="text-5xl sm:text-7xl md:text-8xl font-black text-center tracking-tight drop-shadow-sm transition-colors duration-500">
            <!-- JS will inject current block or passing period name here -->
        </div>
        
        <div id="period-time-range" class="mt-3 text-sm sm:text-lg font-semibold text-slate-500 bg-slate-200/60 px-4 py-1.5 rounded-full hidden">
            <!-- E.g. 7:20 AM – 8:50 AM -->
        </div>

        <!-- Period Progress Bar -->
        <div id="progress-container" class="w-full max-w-md bg-slate-200 h-2 rounded-full mt-6 overflow-hidden hidden">
            <div id="progress-bar" class="bg-slate-600 h-full transition-all duration-500 rounded-full" style="width: 0%"></div>
        </div>
    </div>

    <div id="up-next-container" class="mb-8 sm:mb-12 pt-6 border-t border-slate-200 w-full max-w-lg text-center hidden transition-opacity duration-300">
        <p id="up-next-label" class="text-xs sm:text-sm text-slate-400 uppercase tracking-widest font-bold mb-2">Up Next</p>
        <div class="flex flex-col sm:flex-row justify-center items-center sm:items-baseline space-y-1 sm:space-y-0 sm:space-x-3">
            <span id="next-block-name" class="text-xl sm:text-2xl font-bold text-slate-800"></span>
            <span id="in-label" class="text-slate-400 font-medium text-sm">in</span>
            <span id="countdown" class="text-2xl sm:text-3xl font-mono font-bold text-slate-700 bg-slate-200/70 px-3 py-1 rounded-lg"></span>
        </div>
    </div>

    <div class="fixed bottom-3 right-3 z-50">
        <select id="color-override" class="text-xs bg-slate-100 border border-slate-300 rounded-md px-2 py-1 text-slate-500 hover:text-slate-700 cursor-pointer outline-none shadow-sm transition-colors">
            <option value="auto">Auto-detect Day</option>
            <option value="blue">Force Blue Day</option>
            <option value="gold">Force Gold Day</option>
            <option value="green">Force Green Day</option>
        </select>
    </div>

    <script>
        // Schedule Definitions based on "Daily Bell Schedules 26-27"
        const schedules = {
            normal: [
                { name: "Block 1", start: "07:20", end: "08:50" },
                { name: "Block 2", start: "08:55", end: "10:25" },
                { name: "Advisory", start: "10:30", end: "11:00" },
                { name: "Block 3", start: "11:05", end: "13:05" },
                { name: "Block 4", start: "13:10", end: "14:40" }
            ],
            greenWed: [
                { name: "Green 1B", start: "07:20", end: "08:03" },
                { name: "Green 1G", start: "08:08", end: "08:51" },
                { name: "Green 2B", start: "08:56", end: "09:39" },
                { name: "Green 2G", start: "09:44", end: "10:27" },
                { name: "Green 3B", start: "10:32", end: "11:15" },
                { name: "Green 3G", start: "11:20", end: "12:33" }, // Includes Lunch rotation
                { name: "Green 4B", start: "12:38", end: "13:21" },
                { name: "Green 4G", start: "13:26", end: "14:10" }
            ],
            blueGoldWed: [
                { name: "Block 1", start: "07:20", end: "08:50" },
                { name: "Block 2", start: "08:55", end: "10:25" },
                { name: "Block 3", start: "10:30", end: "12:35" }, // Includes Lunch rotation
                { name: "Block 4", start: "12:40", end: "14:10" }
            ]
        };

        // Provided GREEN Day Dates from calendar mapping
        const greenWednesdays = [
            "2026-09-02", "2026-09-09", "2026-09-30", "2026-11-04",
            "2027-01-20", "2027-02-10", "2027-03-10", "2027-03-31"
        ];

        function timeToSeconds(timeStr) {
            const [hours, minutes] = timeStr.split(':').map(Number);
            return hours * 3600 + minutes * 60;
        }

        function format12Hour(timeStr) {
            const [h24, m] = timeStr.split(':').map(Number);
            const period = h24 >= 12 ? 'PM' : 'AM';
            const h12 = h24 % 12 || 12;
            const minFormatted = String(m).padStart(2, '0');
            return `${h12}:${minFormatted} ${period}`;
        }

        function formatCountdown(seconds) {
            if (seconds <= 0) return "0m 00s";
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            const sFormatted = String(s).padStart(2, '0');
            
            if (h > 0) return `${h}h ${m}m ${sFormatted}s`;
            return `${m}m ${sFormatted}s`;
        }

        function getScheduleAndColor(dateObj) {
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            const isoDate = `${year}-${month}-${day}`;

            const dayOfWeek = dateObj.getDay();
            const overrideVal = document.getElementById('color-override').value;

            let color = 'blue';
            let blocks = schedules.normal;

            // Handle manual override
            if (overrideVal !== 'auto') {
                color = overrideVal;
                if (color === 'green') {
                    blocks = schedules.greenWed;
                } else if (dayOfWeek === 3) { // Wednesday override logic
                    blocks = schedules.blueGoldWed;
                } else {
                    blocks = schedules.normal;
                }
                return { color, blocks };
            }

            // Auto-detect logic
            if (dayOfWeek === 0 || dayOfWeek === 6) {
                return { type: 'weekend', color: 'slate', blocks: [] };
            }

            if (dayOfWeek === 3) { // Wednesdays
                if (greenWednesdays.includes(isoDate)) {
                    return { color: 'green', blocks: schedules.greenWed };
                } else {
                    return { color: 'blue', blocks: schedules.blueGoldWed };
                }
            }

            // Normal M/T/Th/F Logic - Simulating Blue/Gold alternation
            color = (dayOfWeek === 1 || dayOfWeek === 4) ? 'blue' : 'gold';
            return { color: color, blocks: schedules.normal };
        }

        function updateDisplay() {
            const now = new Date();
            const currentSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

            // Set Date Text
            const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date-display').innerText = now.toLocaleDateString('en-US', dateOptions);

            const { color, blocks } = getScheduleAndColor(now);

            // Update Day Badge
            const dayBadge = document.getElementById('day-badge');
            dayBadge.innerText = `${color.toUpperCase()} DAY`;
            if (color === 'blue') dayBadge.className = 'mt-2 inline-block px-3 py-1 rounded-full text-xs font-bold tracking-wider uppercase bg-blue-100 text-blue-800';
            else if (color === 'gold') dayBadge.className = 'mt-2 inline-block px-3 py-1 rounded-full text-xs font-bold tracking-wider uppercase bg-amber-100 text-amber-800';
            else if (color === 'green') dayBadge.className = 'mt-2 inline-block px-3 py-1 rounded-full text-xs font-bold tracking-wider uppercase bg-green-100 text-green-800';
            else dayBadge.className = 'mt-2 inline-block px-3 py-1 rounded-full text-xs font-bold tracking-wider uppercase bg-slate-200 text-slate-700';

            const blockDisplay = document.getElementById('block-display');
            const timeRangeEl = document.getElementById('period-time-range');
            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            const upNextContainer = document.getElementById('up-next-container');
            const upNextLabel = document.getElementById('up-next-label');
            const nextBlockName = document.getElementById('next-block-name');
            const countdownEl = document.getElementById('countdown');

            // Default Text Styling
            blockDisplay.className = `text-5xl sm:text-7xl md:text-8xl font-black text-center tracking-tight transition-colors duration-500 drop-shadow-sm`;

            let activeStateName = "";
            let periodStartTime = null;
            let periodEndTime = null;
            let nextStateName = "";
            let isPassingPeriod = false;

            if (blocks.length === 0) {
                blockDisplay.innerText = "Weekend";
                blockDisplay.classList.add('text-slate-400');
                timeRangeEl.classList.add('hidden');
                progressContainer.classList.add('hidden');
                upNextContainer.classList.add('hidden');
                return;
            }

            const dayStartSecs = timeToSeconds(blocks[0].start);
            const dayEndSecs = timeToSeconds(blocks[blocks.length - 1].end);

            if (currentSeconds < dayStartSecs) {
                // Before School
                activeStateName = "Before School";
                periodStartTime = 0;
                periodEndTime = dayStartSecs;
                nextStateName = blocks[0].name;
                blockDisplay.classList.add('text-slate-600');
            } else if (currentSeconds >= dayEndSecs) {
                // After School
                activeStateName = "After School";
                blockDisplay.innerText = activeStateName;
                blockDisplay.classList.add('text-slate-500');
                timeRangeEl.classList.add('hidden');
                progressContainer.classList.add('hidden');
                upNextContainer.classList.add('hidden');
                return;
            } else {
                // During School Hours - Evaluate blocks & passing periods
                for (let i = 0; i < blocks.length; i++) {
                    const bStart = timeToSeconds(blocks[i].start);
                    const bEnd = timeToSeconds(blocks[i].end);

                    if (currentSeconds >= bStart && currentSeconds < bEnd) {
                        // Inside class period
                        activeStateName = blocks[i].name;
                        periodStartTime = bStart;
                        periodEndTime = bEnd; // Countdown target is EXACT end of class period

                        if (i < blocks.length - 1) {
                            const nextStart = timeToSeconds(blocks[i + 1].start);
                            if (nextStart > bEnd) {
                                nextStateName = "Passing Period";
                            } else {
                                nextStateName = blocks[i + 1].name;
                            }
                        } else {
                            nextStateName = "Dismissal";
                        }
                        break;
                    } else if (i < blocks.length - 1) {
                        const bNextStart = timeToSeconds(blocks[i + 1].start);
                        if (currentSeconds >= bEnd && currentSeconds < bNextStart) {
                            // Inside PASSING PERIOD between blocks[i] and blocks[i+1]
                            isPassingPeriod = true;
                            activeStateName = "Passing Period";
                            periodStartTime = bEnd;
                            periodEndTime = bNextStart; // Countdown target is EXACT end of passing period
                            nextStateName = blocks[i + 1].name;
                            break;
                        }
                    }
                }
            }

            // Apply Block Colors
            if (isPassingPeriod) {
                blockDisplay.classList.add('text-amber-600');
            } else if (color === 'blue') {
                blockDisplay.classList.add('text-blue-600');
            } else if (color === 'gold') {
                blockDisplay.classList.add('text-amber-500');
            } else if (color === 'green') {
                blockDisplay.classList.add('text-green-600');
            } else {
                blockDisplay.classList.add('text-slate-700');
            }

            blockDisplay.innerText = activeStateName;

            // Show current period time range
            if (periodStartTime !== null && periodEndTime !== null) {
                const startStr = format12Hour(
                    activeStateName === "Before School" 
                        ? "07:20" 
                        : (isPassingPeriod ? blocks.find(b => timeToSeconds(b.end) === periodStartTime)?.end || "07:20" : blocks.find(b => timeToSeconds(b.start) === periodStartTime)?.start || "07:20")
                );
                const endStr = format12Hour(
                    activeStateName === "Before School" 
                        ? "07:20" 
                        : (isPassingPeriod ? blocks.find(b => timeToSeconds(b.start) === periodEndTime)?.start || "07:20" : blocks.find(b => timeToSeconds(b.end) === periodEndTime)?.end || "07:20")
                );
                
                timeRangeEl.innerText = `${startStr} – ${endStr}`;
                timeRangeEl.classList.remove('hidden');

                // Progress Bar calculation
                const totalDuration = periodEndTime - periodStartTime;
                const elapsed = Math.max(0, currentSeconds - periodStartTime);
                const percentage = Math.min(100, Math.max(0, (elapsed / totalDuration) * 100));
                
                progressBar.style.width = `${percentage}%`;
                if (color === 'blue') progressBar.className = 'bg-blue-600 h-full transition-all duration-500 rounded-full';
                else if (color === 'gold' || isPassingPeriod) progressBar.className = 'bg-amber-500 h-full transition-all duration-500 rounded-full';
                else if (color === 'green') progressBar.className = 'bg-green-600 h-full transition-all duration-500 rounded-full';
                else progressBar.className = 'bg-slate-600 h-full transition-all duration-500 rounded-full';

                progressContainer.classList.remove('hidden');
            } else {
                timeRangeEl.classList.add('hidden');
                progressContainer.classList.add('hidden');
            }

            // Up Next & Countdown Update
            if (nextStateName && periodEndTime !== null) {
                upNextContainer.classList.remove('hidden');
                const remainingSecs = periodEndTime - currentSeconds;

                if (isPassingPeriod) {
                    upNextLabel.innerText = "Class Starts In";
                } else if (activeStateName === "Before School") {
                    upNextLabel.innerText = "School Starts In";
                } else {
                    upNextLabel.innerText = "Up Next";
                }

                nextBlockName.innerText = nextStateName;
                countdownEl.innerText = formatCountdown(remainingSecs);
            } else {
                upNextContainer.classList.add('hidden');
            }
        }

        document.getElementById('color-override').addEventListener('change', () => {
            updateDisplay();
        });

        // Run immediately, then check every second
        updateDisplay();
        setInterval(updateDisplay, 1000);

    </script>
</body>
</html>
